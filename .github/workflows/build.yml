
name: Build Watch8 Calculator v6

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          python3 scripts/check_apk.py "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 30 "$APK" | tee /tmp/watch8-apksigner.txt
          grep -Eq '^Verified using v[23] scheme .*: true$' /tmp/watch8-apksigner.txt
          "$TOOLS/aapt" dump badging "$APK" | tee /tmp/watch8-badging.txt
          grep -Fq "launchable-activity: name='com.weixiaoyinjie.pricecalculator.MainActivity'" /tmp/watch8-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Calculator-v6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
