
name: Build Watch8 Calculator v6 Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract calculator source
        shell: bash
        run: |
          set -euo pipefail
          unzip -o Watch8_Calculator_v6_SDK_Fixed_Full_Source.zip -d .
          test -f app/build.gradle
          test -f settings.gradle
          test -f scripts/check_apk.py

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -f "$SDK/build-tools/35.0.0/aapt" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
              'platforms;android-35' \
              'build-tools;35.0.0'
          fi

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          python3 scripts/check_apk.py "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Calculator-v6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
