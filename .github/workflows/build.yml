
name: Build Watch8 Calculator v6 Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          test -f app/build.gradle
          test -f app/src/main/java/com/weixiaoyinjie/pricecalculator/MainActivity.java
          test -f scripts/check_apk.py

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -f "$SDK/build-tools/35.0.0/aapt" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          python3 scripts/check_apk.py "$APK"
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 30 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-Calculator-v6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
